<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PRP Phone</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root" class="hidden">
    <div class="phone">
      <div class="screen">
      <div class="statusbar">
        <div class="left">
          <span class="time" id="time">00:00</span>
        </div>
        <div class="right">
          <span class="pill"></span>
        </div>
      </div>

      <div class="wallpaper" id="wallpaper"></div>

      <div class="home">
        <div class="grid" id="appGrid"></div>

        <div class="dock">
          <button class="dockBtn" data-app="messages" title="Messages">💬</button>
          <button class="dockBtn" data-app="phone" title="Phone">📞</button>
          <button class="dockBtn" data-app="contacts" title="Contacts">👥</button>
          <button class="dockBtn" data-app="settings" title="Settings">⚙️</button>
        </div>
      </div>

      <div class="panel hidden" id="panel">
        <div class="panelHeader">
          <div>
            <div class="panelTitle" id="panelTitle">App</div>
            <div class="panelSub" id="panelSub"></div>
          </div>
          <button class="closeBtn" id="closePanel">×</button>
        </div>

        <div class="panelBody" id="panelBody"></div>
      </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
